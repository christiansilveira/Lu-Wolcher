<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Lu Wolcher — Motion Reels</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#05070f;overflow:hidden;font-family:Inter,sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#0b1030 0%,#05070f 70%)}
#glow{position:absolute;left:-200px;top:380px;width:1480px;height:1300px;border-radius:50%;filter:blur(120px);opacity:.55}
#floor{position:absolute;left:0;right:0;top:1000px;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.03) 100%)}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:1900px;perspective-origin:50% 40%}
#laptop{position:absolute;left:60px;top:620px;width:960px;transform-origin:50% 50%;-webkit-box-reflect:below 14px linear-gradient(transparent 52%,rgba(255,255,255,.34))}
#lid{position:relative;padding:16px;background:#07080d;border-radius:26px;border:2px solid #2a2d3d;box-shadow:0 0 90px var(--c,#445),0 40px 80px rgba(0,0,0,.6)}
#lid canvas{display:block;width:928px;height:580px;border-radius:12px}
#glare{position:absolute;inset:16px;border-radius:12px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.10) 42%,rgba(255,255,255,0) 55%)}
#base{position:relative;left:-50px;width:1060px;height:26px;margin-top:-1px;border-radius:2px 2px 34px 34px;background:linear-gradient(180deg,#c9ccd8 0%,#8c90a3 40%,#3b3e50 100%);box-shadow:0 18px 40px rgba(0,0,0,.6)}
#base:after{content:"";position:absolute;left:50%;top:0;width:180px;height:9px;margin-left:-90px;border-radius:0 0 12px 12px;background:#555a70}
#vig{position:absolute;inset:0;background:radial-gradient(100% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
#head{position:absolute;left:0;right:0;top:150px;text-align:center}
#head img{width:380px;display:block;margin:0 auto}
#head p{margin-top:10px;font:500 22px Inter;letter-spacing:.5em;color:#DDB9B5;text-transform:uppercase;padding-left:.5em}
#cta{position:absolute;left:50%;top:1650px;transform:translateX(-50%);white-space:nowrap;padding:30px 64px;border-radius:999px;background:#DDB9B5;color:#14235C;font:800 38px Inter;letter-spacing:.01em;box-shadow:0 0 70px rgba(221,185,181,.55)}
#cta span{font-weight:500;font-family:'Bitstream Charter',serif;font-style:italic}
</style></head><body>
<div id="stage">
  <div id="glow"></div><div id="floor"></div>
  <div id="head"><img src="assets/mark-light.png"></div>
  <div id="cam"><div id="laptop"><div id="lid"><canvas id="c" width="1856" height="1160"></canvas><div id="glare"></div></div><div id="base"></div></div></div>
  <div id="cta">Agende pelo link da bio <span>→</span></div>
  <div id="vig"></div>
</div>
<script src="motion.js"></script>
</body></html>
